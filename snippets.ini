[Excel]
; ============================================================
; Excel Toolkit - Hotstring Snippets
; ============================================================
; Format: trigger = expansion text
;
; Type the trigger followed by ; (semicolon) to fire.
; Example: type "dt;" and it expands to "=TODAY()"
;
; Escape sequences:
;   \s = space
;   \S = non-breaking space
;   \t = tab
;   \n = newline
;
; AHK Send specials (passed through literally):
;   {Enter}, {Tab}, {Left}, {Right}, etc.
;
; Lines starting with ; or # are comments.
; Inline comments start with " #".
; ============================================================

; --- Common Text ---
dt = =TODAY()
em = someone@example.com
; addr = 123 Main Street, City{Left}{Left}{Left}{Left}{Left}

; --- Formulas ---
; sum = =SUM(\s)
; avg = =AVERAGE(\s)
; cnt = =COUNT(\s)

; --- Status Labels ---
; comp = Complete
; pend = Pending
; rev = In Review
; n/a = N/A
